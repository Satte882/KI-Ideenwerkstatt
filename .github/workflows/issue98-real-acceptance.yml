name: Issue 98 real acceptance

on:
  push:
    branches:
      - feature/issue-98-autonomous-business-discovery
    paths:
      - ".github/workflows/issue98-real-acceptance.yml"
      - "scripts/issue98_real_acceptance.py"
      - "ki_radar/accelerator/**"
      - "ki_radar/architecture/**"
      - "templates/accelerator/autonomous_discovery_*.html"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-acceptance:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: issue98-real-acceptance-only
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      USE_SQLITE_FOR_TESTS: "1"
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: deepseek/deepseek-v4.1-flash
      OPENROUTER_REASONING_EXCLUDE: "true"
      ACCELERATOR_LLM_TIMEOUT_SECONDS: "120"
      ACCELERATOR_LLM_MAX_INPUT_CHARS: "50000"
      ACCELERATOR_CAPTURE_MAX_OUTPUT_TOKENS: "32768"
      ACCELERATOR_LLM_MAX_CALLS_PER_CONTEXT: "3"
      ACCELERATOR_LLM_MAX_CALLS_PER_USER_DAY: "20"
      ACCELERATOR_LLM_MAX_CALLS_GLOBAL_DAY: "100"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true

      - name: Verify real-provider credential is available
        shell: bash
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "OPENROUTER_API_KEY repository secret is not configured."
            exit 2
          fi

      - name: Install project dependencies
        run: uv sync --frozen --dev

      - name: Verify acceptance harness style
        run: |
          uv run ruff check scripts/issue98_real_acceptance.py
          uv run ruff format --check scripts/issue98_real_acceptance.py

      - name: Install Playwright Chromium
        run: |
          uv pip install playwright==1.54.0
          uv run playwright install --with-deps chromium

      - name: Apply migrations
        run: uv run python manage.py migrate --noinput

      - name: Run real A/B/C and browser acceptance
        run: uv run python scripts/issue98_real_acceptance.py

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue98-real-acceptance-${{ github.run_id }}
          path: artifacts/issue98-real-acceptance/
          if-no-files-found: warn
          retention-days: 30
