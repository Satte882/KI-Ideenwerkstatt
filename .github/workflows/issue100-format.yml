name: Issue 100 formatter

on:
  push:
    branches:
      - feature/issue-100-ap2-solution-to-governance

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/issue-100-ap2-solution-to-governance
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - run: uv sync --frozen --dev
      - name: Format AP2 slice
        run: >
          uv run ruff format
          ki_radar/accelerator/investigation_brief.py
          ki_radar/accelerator/investigation_runtime.py
          tests/test_issue_4_decision_brief_evidence.py
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ki_radar/accelerator/investigation_brief.py ki_radar/accelerator/investigation_runtime.py tests/test_issue_4_decision_brief_evidence.py
          git commit -m "#100 apply Ruff formatting"
          git push origin HEAD:feature/issue-100-ap2-solution-to-governance
