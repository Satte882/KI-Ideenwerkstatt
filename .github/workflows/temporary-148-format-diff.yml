name: "Temporary #148 formatting diagnostics"
on:
  push:
    branches: ["feat/148-capability-learning"]
jobs:
  formatter-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --dev
      - run: uv run ruff format --diff ki_radar/use_cases/capability_models.py tests/test_issue_148_capability_learning.py
