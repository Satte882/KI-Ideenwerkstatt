name: Issue 98 temporary Ruff formatter

on:
  push:
    branches:
      - feature/issue-98-autonomous-business-discovery

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/issue-98-autonomous-business-discovery
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
      - run: uv sync --frozen --dev
      - name: Format acceptance harness
        run: uv run ruff format scripts/issue98_real_acceptance.py
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/issue98_real_acceptance.py
          git commit -m "#98 format real acceptance harness"
          git push origin HEAD:feature/issue-98-autonomous-business-discovery
