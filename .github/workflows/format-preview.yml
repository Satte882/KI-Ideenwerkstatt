name: PR format preview
on:
  pull_request:
    paths:
      - "ki_radar/accelerator/investigation_runtime.py"
      - ".github/workflows/format-preview.yml"
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --dev
      - run: uv run ruff format ki_radar/accelerator/investigation_runtime.py
      - run: git diff -- ki_radar/accelerator/investigation_runtime.py
