limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
upstream ki_radar { server app:8000; }
server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}
server {
  listen 443 ssl http2;
  server_name _;
  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header X-Content-Type-Options nosniff always;
  client_max_body_size 1m;
  location /static/ { alias /srv/static/; expires 7d; add_header Cache-Control "public"; }
  location = /accounts/login/ { limit_req zone=login burst=5 nodelay; proxy_pass http://ki_radar; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; proxy_read_timeout 60s; }
  location / { proxy_pass http://ki_radar; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; proxy_read_timeout 60s; }
}
